apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: grafana          # пользователь только для чтения (readonly=2)
      defaultDatabase: analytics
    secureJsonData:
      password: grafana
