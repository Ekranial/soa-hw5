name: online-cinema

# Общие настройки брокеров Kafka (KRaft): отдельный контроллер + 2 брокера
x-kafka-broker: &kafka-broker
  image: apache/kafka:3.8.0
  depends_on:
    kafka-controller:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "nc -z localhost 19092 || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 30
  restart: unless-stopped

x-kafka-broker-env: &kafka-broker-env
  KAFKA_PROCESS_ROLES: broker
  KAFKA_LISTENERS: INTERNAL://:19092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
  CLUSTER_ID: ${KAFKA_CLUSTER_ID}
  # отказоустойчивость: служебные топики и топики по умолчанию — 2 реплики, писать можно при 1 живой
  KAFKA_DEFAULT_REPLICATION_FACTOR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 1
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xmx256m -Xms256m

services:
  # ================================================================== Kafka
  kafka-controller:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_HEAP_OPTS: -Xmx128m -Xms128m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9093 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  kafka-1:
    <<: *kafka-broker
    environment:
      <<: *kafka-broker-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092

  kafka-2:
    <<: *kafka-broker
    environment:
      <<: *kafka-broker-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:19092,PLAINTEXT://kafka-2:19092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 2
      SCHEMA_REGISTRY_HEAP_OPTS: -Xmx128m -Xms128m
    ports:
      - "8081:8081"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  # Создаёт топик movie-events (3 партиции, RF=2, min.insync=1) и регистрирует Avro-схему
  kafka-init:
    build:
      context: .
      dockerfile: movie-service/Dockerfile
    command: ["python", "-m", "app.init_kafka"]
    environment: &kafka-client-env
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC: movie-events
      KAFKA_TOPIC_PARTITIONS: 3
      KAFKA_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TOPIC_MIN_INSYNC_REPLICAS: 1
    depends_on:
      schema-registry:
        condition: service_healthy

  # ================================================================== ClickHouse
  clickhouse:
    build:
      context: .
      dockerfile: clickhouse/Dockerfile
    ports:
      - "8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  clickhouse-migrate:
    build:
      context: .
      dockerfile: aggregation-service/Dockerfile
    command: ["python", "-m", "app.ch_migrate"]
    environment: &ch-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: app
      CLICKHOUSE_DATABASE: analytics
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/analytics
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ================================================================== PostgreSQL
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d analytics"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  postgres-migrate:
    build:
      context: .
      dockerfile: postgres/Dockerfile.migrations
    command: -url=jdbc:postgresql://postgres:5432/analytics -user=${POSTGRES_USER} -password=${POSTGRES_PASSWORD} -connectRetries=30 migrate
    environment:
      JAVA_ARGS: -Xmx128m
    depends_on:
      postgres:
        condition: service_healthy

  # ================================================================== S3 (SeaweedFS)
  # S3-совместимое хранилище. MinIO больше не публикует Docker-образы, поэтому используется
  # SeaweedFS (master + volume + filer + S3 API в одном процессе). Ключ доступа берётся из .env.
  s3:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities": [{"name": "analytics",
          "credentials": [{"accessKey": "${S3_ACCESS_KEY}", "secretKey": "${S3_SECRET_KEY}"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=64 -volume.max=20           -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/healthz && nc -z localhost 8333 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ================================================================== сервисы
  movie-service:
    build:
      context: .
      dockerfile: movie-service/Dockerfile
    environment:
      <<: *kafka-client-env
      PUBLISH_MAX_RETRIES: 5
      PUBLISH_BASE_BACKOFF_SECONDS: 0.2
      GENERATOR_ENABLED: ${GENERATOR_ENABLED:-true}
      GENERATOR_EVENTS_PER_SECOND: ${GENERATOR_EVENTS_PER_SECOND:-5}
      GENERATOR_BACKFILL_DAYS: ${GENERATOR_BACKFILL_DAYS:-14}
      GENERATOR_USERS: ${GENERATOR_USERS:-1500}
    ports:
      - "8000:8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  aggregation-service:
    build:
      context: .
      dockerfile: aggregation-service/Dockerfile
    environment:
      <<: *ch-env
      AGGREGATION_INTERVAL_SECONDS: ${AGGREGATION_INTERVAL_SECONDS:-60}
      AGGREGATION_LOOKBACK_DAYS: ${AGGREGATION_LOOKBACK_DAYS:-30}
      TOP_MOVIES_LIMIT: 10
      EXPORT_INTERVAL_SECONDS: ${EXPORT_INTERVAL_SECONDS:-300}
      S3_ENDPOINT_URL: http://s3:8333
      S3_BUCKET: movie-analytics
    ports:
      - "8001:8001"
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
      postgres-migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  grafana:
    build:
      context: .
      dockerfile: grafana/Dockerfile
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/movie-analytics.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # встроенная SQLite Grafana в контейнере ловит "database is locked": WAL-режим + без алертинга
      GF_DATABASE_WAL: "true"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ALERTING_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ================================================================== тесты
  # docker compose run --rm tests   (поднимет всё нужное и прогонит интеграционные тесты)
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      PRODUCER_URL: http://movie-service:8000
      AGGREGATION_URL: http://aggregation-service:8001
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/analytics
      S3_ENDPOINT_URL: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      movie-service:
        condition: service_healthy
      aggregation-service:
        condition: service_healthy

volumes:
  clickhouse-data:
  postgres-data:
  s3-data:
